<script id="lesson-data" type="application/json">{"lessons": [{"title": "Digital Detox · Speaking Part 2", "blocks": [{"speaker": "", "text": "I’d like to talk about a Sunday afternoon when I tried a digital detox. At the time, I was spending almost five hours a day on my phone, and I felt that I needed a break.", "ids": [0, 1]}, {"speaker": "", "text": "Although I needed to be online for work, I often continued scrolling long after I’d finished. What prompted me to act was a family dinner. My mother asked me a question, but I’d been so absorbed in my screen that I had no idea what she’d said. It was embarrassing, especially because we rarely had time to eat together.", "ids": [2, 3, 4, 5]}, {"speaker": "", "text": "Rather than trying to disconnect completely, I decided to start small. I turned off notifications, except for those from important contacts, and arranged a screen-free afternoon with a friend. We put our phones away, went for a walk and cooked dinner together.", "ids": [6, 7, 8]}, {"speaker": "", "text": "Initially, I kept reaching for my phone without thinking. Checking it had become an automatic habit, so having nothing to scroll through felt surprisingly strange. However, that feeling gradually faded once we started chatting. We ended up talking about things we’d never normally discuss through messages.", "ids": [9, 10, 11, 12]}, {"speaker": "", "text": "It turned out to be a pretty rewarding experience. Without constant interruptions, I felt more relaxed and could give my friend my full attention.", "ids": [13, 14]}, {"speaker": "", "text": "Since then, I’ve kept my phone away during meals and taken occasional breaks from social media. I still need technology to work and keep in touch with people, but now I’m more careful about letting it take over my free time.", "ids": [15, 16]}]}, {"title": "Self-surveillance · Speaking Part 2", "blocks": [{"speaker": "", "text": "I’d like to describe how I started tracking my phone use to get a clearer picture of my digital habits. I think of it as a form of self-surveillance because I was observing my own behaviour and using that information to make changes.", "ids": [17, 18]}, {"speaker": "", "text": "It started a few weeks ago when I checked my screen-time report. Seeing almost five hours of daily use came as quite a shock. I’d assumed I mainly used my phone for work, but much of that time actually went on short videos and social media.", "ids": [19, 20, 21]}, {"speaker": "", "text": "For the following week, I reviewed the report each evening and noted what I’d been doing before my longest scrolling sessions. I also asked myself why every time I took out my phone.", "ids": [22, 23]}, {"speaker": "", "text": "A pattern soon emerged: whenever a task became difficult, I reached for my phone. I wasn’t simply checking messages; I was often trying to avoid something frustrating. Recognising that pattern helped me understand why app limits alone hadn’t solved the problem. So, instead of just watching the numbers, I focused on removing distractions. I left my phone out of reach while working and took a short walk when I needed a break. I introduced these changes at my own pace, which made them easier to maintain.", "ids": [24, 25, 26, 27, 28, 29]}, {"speaker": "", "text": "After two weeks, my daily screen time had fallen by about an hour. More importantly, I could finish tasks with fewer interruptions.", "ids": [30, 31]}, {"speaker": "", "text": "What I found most useful was learning to make conscious choices about my phone use. I still check the report, but now I treat it as useful feedback rather than something to feel guilty about.", "ids": [32, 33]}]}], "sentences": [{"id": 0, "lesson": 0, "block": 0, "text": "I’d like to talk about a Sunday afternoon when I tried a digital detox.", "vi": "Tôi muốn kể về một chiều Chủ nhật khi tôi thử giảm sử dụng thiết bị số.", "chunks": ["I’d like to talk about", "a Sunday afternoon", "when I tried a digital detox."], "start": 0.005, "end": 5.39, "units": [{"text": "I’d like to talk about a Sunday afternoon when I tried a digital detox.", "start": 0.005, "end": 5.39}]}, {"id": 1, "lesson": 0, "block": 0, "text": "At the time, I was spending almost five hours a day on my phone, and I felt that I needed a break.", "vi": "Khi ấy, tôi dành gần năm tiếng mỗi ngày cho điện thoại và cảm thấy mình cần nghỉ một chút.", "chunks": ["At the time,", "I was spending almost five hours a day", "on my phone,", "and I felt that I needed a break."], "start": 5.44, "end": 11.31, "units": [{"text": "At the time, I was spending almost five hours a day on my phone,", "start": 5.44, "end": 9.24}, {"text": "and I felt that I needed a break.", "start": 9.48, "end": 11.31}]}, {"id": 2, "lesson": 0, "block": 1, "text": "Although I needed to be online for work, I often continued scrolling long after I’d finished.", "vi": "Mặc dù cần lên mạng để làm việc, tôi thường tiếp tục lướt rất lâu sau khi đã làm xong.", "chunks": ["Although I needed to be online for work,", "I often continued scrolling", "long after I’d finished."], "start": 11.69, "end": 17.72, "units": [{"text": "Although I needed to be online for work, I often continued scrolling long after I’d finished.", "start": 11.69, "end": 17.72}]}, {"id": 3, "lesson": 0, "block": 1, "text": "What prompted me to act was a family dinner.", "vi": "Điều thôi thúc tôi hành động là một bữa tối gia đình.", "chunks": ["What prompted me to act", "was", "a family dinner."], "start": 17.94, "end": 21.323, "units": [{"text": "What prompted me to act was a family dinner.", "start": 17.94, "end": 21.323}]}, {"id": 4, "lesson": 0, "block": 1, "text": "My mother asked me a question, but I’d been so absorbed in my screen that I had no idea what she’d said.", "vi": "Mẹ hỏi tôi một câu, nhưng tôi mải mê nhìn màn hình đến mức không biết mẹ vừa nói gì.", "chunks": ["My mother asked me a question,", "but I’d been so absorbed in my screen", "that I had no idea what she’d said."], "start": 21.387, "end" "end": 68.2, "units": [{"text": "We ended up talking about things we’d never normally discuss through messages.", "start": 64.05, "end": 68.2}]}, {"id": 13, "lesson": 0, "block": 4, "text": "It turned out to be a pretty rewarding experience.", "vi": "Đó hóa ra là một trải nghiệm khá đáng giá.", "chunks": ["It turned out to be", "a pretty rewarding", "experience."], "start": 68.49, "end": 71.76, "units": [{"text": "It turned out to be a pretty rewarding experience.", "start": 68.49, "end": 71.76}]}, {"id": 14, "lesson": 0, "block": 4, "text": "Without constant interruptions, I felt more relaxed and could give my friend my full attention.", "vi": "Không bị gián đoạn liên tục, tôi thấy thoải mái hơn và có thể hoàn toàn chú tâm vào người bạn của mình.", "chunks": ["Without constant interruptions,", "I felt more relaxed", "and could give my friend my full attention."], "start": 71.92, "end": 77.87, "units": [{"text": "Without constant interruptions, I felt more relaxed and could give my friend my full attention.", "start": 71.92, "end": 77.87}]}, {"id": 15, "lesson": 0, "block": 5, "text": "Since then, I’ve kept my phone away during meals and taken occasional breaks from social media.", "vi": "Từ đó, tôi cất điện thoại trong giờ ăn và thỉnh thoảng tạm nghỉ dùng mạng xã hội.", "chunks": ["Since then,", "I’ve kept my phone away during meals", "and taken occasional breaks from social media."], "start": 78.05, "end": 83.6, "units": [{"text": "Since then, I’ve kept my phone away during meals and taken occasional breaks from social media.", "start": 78.05, "end": 83.6}]}, {"id": 16, "lesson": 0, "block": 5, "text": "I still need technology to work and keep in touch with people, but now I’m more careful about letting it take over my free time.", "vi": "Tôi vẫn cần công nghệ để làm việc và giữ liên lạc, nhưng giờ tôi cẩn trọng hơn để nó không chiếm hết thời gian rảnh.", "chunks": ["I still need technology to work", "and keep in touch with people,", "but now I’m more careful", "about letting it take over my free time."], "start": 83.68, "end": 90.74, "units": [{"text": "I still need technology to work and keep in touch with people,", "start": 83.68, "end": 86.94}, {"text": "but now I’m more careful about letting it take over my free time.", "start": 87.12, "end": 90.74}]}, {"id": 17, "lesson": 1, "block": 0, "text": "I’d like to describe how I started tracking my phone use to get a clearer picture of my digital habits.", "vi": "Tôi muốn kể về việc bắt đầu theo dõi thời gian dùng điện thoại để hiểu rõ hơn thói quen sử dụng thiết bị số của mình.", "chunks": ["I’d like to describe", "how I started tracking my phone use", "to get a clearer picture of my digital habits."], "start": 0.005, "end": 6.98, "units": [{"text": "I’d like to describe how I started tracking my phone use", "start": 0.005, "end": 3.94}, {"text": "to get a clearer picture of my digital habits.", "start": 3.96, "end": 6.98}]}, {"id": 18, "lesson": 1, "block": 0, "text": "I think of it as a form of self-surveillance because I was observing my own behaviour and using that information to make changes.", "vi": "Tôi xem đó là một hình thức tự giám sát vì tôi quan sát hành vi của bản thân và dùng thông tin ấy để thay đổi.", "chunks": ["I think of it as a form of self-surveillance", "because I was observing my own behaviour", "and using that information to make changes."], "start": 7.45, "end": 15.17, "units": [{"text": "I think of it as a form of self-surveillance", "start": 7.45, "end": 10.28}, {"text": "because I was observing my own behaviour", "start": 10.32, "end": 12.255}, {"text": "and using that information to make changes.", "start": 12.265, "end": 15.17}]}, {"id": 19, "lesson": 1, "block": 1, "text": "It started a few weeks ago when I checked my screen-time report.", "vi": "Việc này bắt đầu vài tuần trước, khi tôi xem báo cáo thời gian sử dụng màn hình.", "chunks": ["It started a few weeks ago", "when I checked", "my screen-time report."], "start": 16.06, "end": 20.07, "units": [{"text": "It started a few weeks ago when I checked my screen-time report.", "start": 16.06, "end": 20.07}]}, {"id": 20, "lesson": 1, "block": 1, "text": "Seeing almost five hours of daily use came as quite a shock.", "vi": "Việc thấy mình dùng điện thoại gần năm tiếng mỗi ngày khiến tôi khá bất ngờ.", "chunks": ["Seeing almost five hours of daily use", "came as", "quite a shock."], "start": 20.67, "end": 25.28, "units": [{"text": "Seeing almost five hours of daily use came as quite a shock.", "start": 20.67, "end": 25.28}]}, {"id": 21, "lesson": 1, "block": 1, "text": "I’d assumed I mainly used my phone for work, but much of that time actually went on short videos and social media.", "vi": "Tôi từng nghĩ mình chủ yếu dùng điện thoại cho công việc, nhưng thực ra phần lớn thời gian lại dành cho video ngắn và mạng xã hội.", "chunks": ["I’d assumed I mainly used my phone for work,", "but much of that time actually went on", "short videos and social media."], "start": 25.82, "end": 32.9, "units": [{"text": "I’d assumed I mainly used my phone for work,", "start": 25.82, "end": 28.28}, {"text": "but much of that time actually went on short videos and social media.", "start": 28.54, "end": 32.9}]}, {"id": 22, "lesson": 1, "block": 2, "text": "For the following week, I reviewed the report each evening and noted what I’d been doing before my longest scrolling sessions.", "vi": "Trong tuần tiếp theo, mỗi tối tôi xem lại báo cáo và ghi lại mình đã làm gì trước những lần lướt điện thoại lâu nhất.", "chunks": ["For the following week,", "I reviewed the report each evening", "and noted what I’d been doing", "before my longest scrolling sessions."], "start": 33.47, "end": 40.72, "units": [{"text": "For the following week, I reviewed the report each evening", "start": 33.47, "end": 36.595}, {"text": "and noted what I’d been doing before my longest scrolling sessions.", "start": 36.605, "end": 40.72}]}, {"id": 23, "lesson": 1, "block": 2, "text": "I also asked myself why every time I took out my phone.", "vi": "Tôi cũng tự hỏi tại sao mỗi lần lấy điện thoại ra.", "chunks": ["I also asked myself why", "every time", "I took out my phone."], "start": 40.94, "end": 44.28, "units": [{"text": "I also asked myself why every time I took out my phone.", "start": 40.94, "end": 44.28}]}, {"id": 24, "lesson": 1, "block": 3, "text": "A pattern soon emerged: whenever a task became difficult, I reached for my phone.", "vi": "Một quy luật sớm lộ rõ: cứ khi công việc trở nên khó khăn, tôi lại với lấy điện thoại.", "chunks": ["A pattern soon emerged:", "whenever a task became difficult,", "I reached for my phone."], "start": 44.99, "end": 50.83, "units": [{"text": "A pattern soon emerged: whenever a task became difficult, I reached for my phone.", "start": 44.99, "end": 50.83}]}, {"id": 25, "lesson": 1, "block": 3, "text": "I wasn’t simply checking messages; I was often trying to avoid something frustrating.", "vi": "Tôi không chỉ đơn thuần kiểm tra tin nhắn; tôi thường đang cố né tránh một điều khiến mình bực bội.", "chunks": ["I wasn’t simply checking messages;", "I was often trying to avoid", "something frustrating."], "start": 51.52, "end": 56.6, "units": [{"text": "I wasn’t simply checking messages; I was often trying to avoid something frustrating.", "start": 51.52, "end": 56.6}]}, {"id": 26, "lesson": 1, "block": 3, "text": "Recognising that pattern helped me understand why app limits alone hadn’t solved the problem.", "vi": "Nhận ra quy luật ấy giúp tôi hiểu vì sao chỉ đặt giới hạn ứng dụng vẫn chưa giải quyết được vấn đề.", "chunks": ["Recognising that pattern", "helped me understand", "why app limits alone hadn’t solved the problem."], "start": 57.23, "end": 62.95, "units": [{"text": "Recognising that pattern helped me understand why app limits alone hadn’t solved the problem.", "start": 57.23, "end": 62.95}]}, {"id": 27, "lesson": 1, "block": 3, "text": "So, instead of just watching the numbers, I focused on removing distractions.", "vi": "Vì vậy, thay vì chỉ nhìn vào các con số, tôi tập trung loại bỏ những yếu tố gây xao nhãng.", "chunks": ["So, instead of just watching the numbers,", "I focused on", "removing distractions."], "start": 63.57, "end": 68.6, "units": [{"text": "So, instead of just watching the numbers, I focused on removing distractions.", "start": 63.57, "end": 68.6}]}, {"id": 28, "lesson": 1, "block": 3, "text": "I left my phone out of reach while working and took a short walk when I needed a break.", "vi": "Tôi để điện thoại ngoài tầm với khi làm việc và đi dạo một chút khi cần nghỉ.", "chunks": ["I left my phone out of reach while working", "and took a short walk", "when I needed a break."], "start": 69.02, "end": 73.78, "units": [{"text": "I left my phone out of reach while working", "start": 69.02, "end": 71.135}, {"text": "and took a short walk when I needed a break.", "start": 71.145, "end": 73.78}]}, {"id": 29, "lesson": 1, "block": 3, "text": "I introduced these changes at my own pace, which made them easier to maintain.", "vi": "Tôi áp dụng những thay đổi này theo nhịp độ của mình, nhờ vậy dễ duy trì hơn.", "chunks": ["I introduced these changes", "at my own pace,", "which made them easier to maintain."], "start": 74.3, "end": 78.88, "units": [{"text": "I introduced these changes at my own pace, which made them easier to maintain.", "start": 74.3, "end": 78.88}]}, {"id": 30, "lesson": 1, "block": 4, "text": "After two weeks, my daily screen time had fallen by about an hour.", "vi": "Sau hai tuần, thời gian sử dụng màn hình mỗi ngày của tôi đã giảm khoảng một tiếng.", "chunks": ["After two weeks,", "my daily screen time had fallen", "by about an hour."], "start": 79.69, "end": 83.71, "units": [{"text": "After two weeks, my daily screen time had fallen by about an hour.", "start": 79.69, "end": 83.71}]}, {"id": 31, "lesson": 1, "block": 4, "text": "More importantly, I could finish tasks with fewer interruptions.", "vi": "Quan trọng hơn, tôi có thể hoàn thành công việc mà ít bị gián đoạn hơn.", "chunks": ["More importantly,", "I could finish tasks", "with fewer interruptions."], "start": 84.23, "end": 87.78, "units": [{"text": "More importantly, I could finish tasks with fewer interruptions.", "start": 84.23, "end": 87.78}]}, {"id": 32, "lesson": 1, "block": 5, "text": "What I found most useful was learning to make conscious choices about my phone use.", "vi": "Điều tôi thấy hữu ích nhất là học cách đưa ra lựa chọn có ý thức về việc dùng điện thoại.", "chunks": ["What I found most useful", "was learning to make conscious choices", "about my phone use."], "start": 88.63, "end": 93.33, "units": [{"text": "What I found most useful was learning to make conscious choices about my phone use.", "start": 88.63, "end": 93.33}]}, {"id": 33, "lesson": 1, "block": 5, "text": "I still check the report, but now I treat it as useful feedback rather than something to feel guilty about.", "vi": "Tôi vẫn xem báo cáo, nhưng giờ coi đó là phản hồi hữu ích thay vì điều khiến mình cảm thấy có lỗi.", "chunks": ["I still check the report,", "but now I treat it as useful feedback", "rather than something to feel guilty about."], "start": 93.61, "end": 99.28, "units": [{"text": "I still check the report, but now I treat it as useful feedback", "start": 93.61, "end": 97.0}, {"text": "rather than something to feel guilty about.", "start": 97.28, "end": 99.28}]}], "reference": {"title": "Digital Detox · Podcast", "blocks": [{"speaker": "Presenter", "text": "So, we're back in the studio. Welcome back, everyone. My name's Rick Walker. From our laptops to our televisions, from the displays on our smartphones to those on our satnavs, we are in front of screens all the time. Have you ever wondered what it would be like to disconnect completely? To choose not to have access to the internet? If you have, you may be in need of a digital detox – a total switch-off from all things digital. The idea of people taking a digital detox is becoming more and more popular, especially amongst young people – and today we're joined by someone who's tried a number of digital detox activities and is here to give us some advice about it. Amanda Vince, welcome to the studio.", "ids": [0, 1, 2, 3, 4, 5, 6, 7, 8]}, {"speaker": "Amanda", "text": "Thank you very much.", "ids": [9]}, {"speaker": "Presenter", "text": "So, Amanda, you work for a fashion magazine in London, right? I guess your work means you need to be online a lot.", "ids": [10, 11]}, {"speaker": "Amanda", "text": "Oh, yes. Apart from the hundreds of emails I get every day, I'm always browsing fashion websites, as well as online videos. I also need to be very active online, especially on Twitter and Instagram – sharing what we're doing in the magazine, interacting with designers, photographers, influencers … it never stops, literally. Then of course there's my friends and family to keep in touch with online too, and for me, my work grew out of my passion, so friends and work colleagues aren't two totally separate groups of people and it all gets a bit messy online sometimes. I think I'm online for at least 12 hours a day.", "ids": [12, 13, 14, 15, 16]}, {"speaker": "Presenter", "text": "So, how did you get the idea for a digital detox?", "ids": [17]}, {"speaker": "Amanda", "text": "I read a book about it, called Log Off: How to Stay Connected after Disconnecting. The author's name is Blake Snow. That book gave me some really good advice and made me think about trying to change some of my digital habits. I started with removing distraction.", "ids": [18, 19, 20, 21]}, {"speaker": "Presenter", "text": "What do you mean by that?", "ids": [22]}, {"speaker": "Amanda", "text": "That means turning off alerts, buzzes, alarms or notifications of any kind. I had notifications set up for everything, and it meant I was always being forced to look at my phone. Removing all of them except for important contacts helped me focus immediately. The book also made a really good point, that we should ask ourselves 'Why?' every time we take out our phone. I realised that most of the times I looked at my phone were because I was trying to avoid or ignore something else happening right in front of me. It was an automatic habit.", "ids": [23, 24, 25, 26, 27, 28]}, {"speaker": "Presenter", "text": "I have to confess, that happens to me too. But what else are you going to do when you're standing in line at the bank or waiting for your train?", "ids": [29, 30]}, {"speaker": "Amanda", "text": "OK, yes, I'm the first to admit that it's great for helping time go by. But speaking personally, I found I wasn't just checking my phone to kill time when I was alone. I was also doing it with friends or family around.", "ids": [31, 32, 33]}, {"speaker": "Presenter", "text": "Hmmm … right. Well, so far, this doesn't sound too drastic. Turning off notifications and becoming aware of when we use our devices. That sounds easy.", "ids": [34, 35, 36, 37]}, {"speaker": "Amanda", "text": "Yes, it's the first step. Once we begin to realise just how much of a grip our devices have on us, then we're ready to really take the next step. First, my partner and I did a weekend with absolutely no screens. She found it easier than I did. For me, it was a little bit scary at first but it turned out to be a pretty rewarding experience.", "ids": [38, 39, 40, 41, 42]}, {"speaker": "Presenter", "text": "A whole weekend, huh? I don't know if I could ...", "ids": [43, 44]}, {"speaker": "Amanda", "text": "I think everyone has to do this at their own pace. If a weekend feels too much, maybe just try for an evening. Then work your way up to more. I guarantee, once you've tried it, you'll want to try it again. We're going to try for a whole week in the summer.", "ids": [45, 46, 47, 48, 49]}, {"speaker": "Presenter", "text": "OK, let's pause there then and see what our listeners have to say. You can call us here directly, or send us a message on any of our social media channels ... oops, should I be saying that? Anyway, more after the break.", "ids": [50, 51, 52]}]}, "cards": [{"phrase": "a digital detox", "ipa": "/ə ˌdɪdʒɪtl ˈdiːtɒks/", "vi": "một đợt giảm sử dụng thiết bị số", "type": "Useful chunk", "sid": 0, "dictionary": "https://dictionary.cambridge.org/dictionary/english/detox"}, {"phrase": "needed a break", "ipa": "/ˈniːdɪd ə breɪk/", "vi": "cần nghỉ một chút", "type": "Collocation", "sid": 1, "dictionary": "https://dictionary.cambridge.org/dictionary/english/break"}, {"phrase": "needed to be online", "ipa": "/ˈniːdɪd tə biː ˌɒnˈlaɪn/", "vi": "cần lên mạng", "type": "Useful chunk", "sid": 2, "dictionary": "https://dictionary.cambridge.org/dictionary/english/online"}, {"phrase": "What prompted me to act", "ipa": "/wɒt ˈprɒmptɪd miː tə ækt/", "vi": "điều thôi thúc tôi hành động", "type": "Grammar pattern", "sid": 3, "dictionary": "https://dictionary.cambridge.org/dictionary/english/prompt"}, {"phrase": "absorbed in my screen", "ipa": "/əbˈzɔːbd ɪn maɪ skriːn/", "vi": "mải mê nhìn màn hình", "type": "Collocation", "sid": 4, "dictionary": "https://dictionary.cambridge.org/dictionary/english/absorbed"}, {"phrase": "disconnect completely", "ipa": "/ˌdɪskəˈnekt kəmˈpliːtli/", "vi": "ngắt kết nối hoàn toàn", "type": "Collocation", "sid": 6, "dictionary": "https://dictionary.cambridge.org/dictionary/english/disconnect"}, {"phrase": "turned off notifications", "ipa": "/tɜːnd ɒf ˌnəʊtɪfɪˈkeɪʃnz/", "vi": "tắt thông báo", "type": "Collocation", "sid": 7, "dictionary": "https://dictionary.cambridge.org/dictionary/english/notification"}, {"phrase": "important contacts", "ipa": "/ɪmˈpɔːtənt ˈkɒntækts/", "vi": "những liên hệ quan trọng", "type": "Collocation", "sid": 7, "dictionary": "https://dictionary.cambridge.org/dictionary/english/contact"}, {"phrase": "put our phones away", "ipa": "/pʊt aʊə fəʊnz əˈweɪ/", "vi": "cất điện thoại của chúng tôi đi", "type": "Useful chunk", "sid": 8, "dictionary": "https://dictionary.cambridge.org/dictionary/english/put-away"}, {"phrase": "went for a walk", "ipa": "/went fər ə wɔːk/", "vi": "đi dạo", "type": "Collocation", "sid": 8, "dictionary": "https://dictionary.cambridge.org/dictionary/english/walk"}, {"phrase": "an automatic habit", "ipa": "/ən ˌɔːtəˈmætɪk ˈhæbɪt/", "vi": "một thói quen vô thức", "type": "Collocation", "sid": 10, "dictionary": "https://dictionary.cambridge.org/dictionary/english/habit"}, {"phrase": "that feeling gradually faded", "ipa": "/ðæt ˈfiːlɪŋ ˈɡrædʒuəli ˈfeɪdɪd/", "vi": "cảm giác ấy dần biến mất", "type": "Useful chunk", "sid": 11, "dictionary": "https://dictionary.cambridge.org/dictionary/english/fade"}, {"phrase": "ended up talking", "ipa": "/ˈendɪd ʌp ˈtɔːkɪŋ/", "vi": "cuối cùng lại trò chuyện", "type": "Grammar pattern", "sid": 12, "dictionary": "https://dictionary.cambridge.org/dictionary/english/end-up"}, {"phrase": "a pretty rewarding experience", "ipa": "/ə ˈprɪti rɪˈwɔːdɪŋ ɪkˈspɪəriəns/", "vi": "một trải nghiệm khá đáng giá", "type": "Collocation", "sid": 13, "dictionary": "https://dictionary.cambridge.org/dictionary/english/rewarding"}, {"phrase": "constant interruptions", "ipa": "/ˈkɒnstənt ˌɪntəˈrʌpʃnz/", "vi": "những sự gián đoạn liên tục", "type": "Collocation", "sid": 14, "dictionary": "https://dictionary.cambridge.org/dictionary/english/interrupt"}, {"phrase": "give my friend my full attention", "ipa": "/ɡɪv maɪ frend maɪ fʊl əˈtenʃn/", "vi": "dành toàn bộ sự chú tâm cho người bạn", "type": "Collocation", "sid": 14, "dictionary": "https://dictionary.cambridge.org/dictionary/english/attention"}, {"phrase": "keep in touch with people", "ipa": "/kiːp ɪn tʌtʃ wɪð ˈpiːpl/", "vi": "giữ liên lạc với mọi người", "type": "Useful chunk", "sid": 16, "dictionary": "https://dictionary.cambridge.org/dictionary/english/touch"}, {"phrase": "take over my free time", "ipa": "/teɪk ˈəʊvə maɪ friː taɪm/", "vi": "chiếm hết thời gian rảnh của tôi", "type": "Useful chunk", "sid": 16, "dictionary": "https://dictionary.cambridge.org/dictionary/english/take-over"}, {"phrase": "get a clearer picture of my digital habits", "ipa": "/ɡet ə ˈklɪərə ˈpɪktʃər əv maɪ ˈdɪdʒɪtl ˈhæbɪts/", "vi": "hiểu rõ hơn về thói quen dùng thiết bị số của mình", "type": "Useful chunk", "sid": 17, "dictionary": "https://dictionary.cambridge.org/dictionary/english/picture"}, {"phrase": "observing my own behaviour", "ipa": "/əbˈzɜːvɪŋ maɪ əʊn bɪˈheɪvjə/", "vi": "quan sát hành vi của chính mình", "type": "Collocation", "sid": 18, "dictionary": "https://dictionary.cambridge.org/dictionary/english/observe"}, {"phrase": "came as quite a shock", "ipa": "/keɪm əz kwaɪt ə ʃɒk/", "vi": "khiến tôi khá bất ngờ", "type": "Useful chunk", "sid": 20, "dictionary": "https://dictionary.cambridge.org/dictionary/english/shock"}, {"phrase": "my longest scrolling sessions", "ipa": "/maɪ ˈlɒŋɡɪst ˈskrəʊlɪŋ ˈseʃnz/", "vi": "những lần tôi lướt điện thoại lâu nhất", "type": "Useful chunk", "sid": 22, "dictionary": "https://dictionary.cambridge.org/dictionary/english/scroll"}, {"phrase": "A pattern soon emerged", "ipa": "/ə ˈpætən suːn ɪˈmɜːdʒd/", "vi": "một quy luật sớm lộ rõ", "type": "Collocation", "sid": 24, "dictionary": "https://dictionary.cambridge.org/dictionary/english/pattern"}, {"phrase": "trying to avoid something frustrating", "ipa": "/ˈtraɪɪŋ tə əˈvɔɪd ˈsʌmθɪŋ frʌˈstreɪtɪŋ/", "vi": "cố né tránh điều gây bực bội", "type": "Useful chunk", "sid": 25, "dictionary": "https://dictionary.cambridge.org/dictionary/english/frustrating"}, {"phrase": "removing distractions", "ipa": "/rɪˈmuːvɪŋ dɪˈstrækʃnz/", "vi": "loại bỏ các yếu tố gây xao nhãng", "type": "Collocation", "sid": 27, "dictionary": "https://dictionary.cambridge.org/dictionary/english/distraction"}, {"phrase": "out of reach", "ipa": "/aʊt əv riːtʃ/", "vi": "ngoài tầm với", "type": "Useful chunk", "sid": 28, "dictionary": "https://dictionary.cambridge.org/dictionary/english/reach"}, {"phrase": "at my own pace", "ipa": "/ət maɪ əʊn peɪs/", "vi": "theo nhịp độ phù hợp với mình", "type": "Useful chunk", "sid": 29, "dictionary": "https://dictionary.cambridge.org/dictionary/english/pace"}, {"phrase": "my daily screen time", "ipa": "/maɪ ˈdeɪli skriːn taɪm/", "vi": "thời gian sử dụng màn hình hằng ngày của tôi", "type": "Useful chunk", "sid": 30, "dictionary": "https://dictionary.cambridge.org/dictionary/english/screen-time"}, {"phrase": "make conscious choices", "ipa": "/meɪk ˈkɒnʃəs ˈtʃɔɪsɪz/", "vi": "đưa ra lựa chọn có ý thức", "type": "Collocation", "sid": 32, "dictionary": "https://dictionary.cambridge.org/dictionary/english/conscious"}, {"phrase": "useful feedback", "ipa": "/ˈjuːsfl ˈfiːdbæk/", "vi": "phản hồi hữu ích", "type": "Collocation", "sid": 33, "dictionary": "https://dictionary.cambridge.org/dictionary/english/feedback"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lesson-data').textContent),S=DATA.sentences,C=DATA.cards;
const $=id=>document.getElementById(id),main=$('main'),players=[$('audio0'),$('audio1')];let audio=players[0];
let lesson=0,tab='home',mode='chunks',idx=0,viGlobal=false,viSentence=false,hintShown=false,answerShown=false,selected=[],bank=[],written='',feedback='',feedbackType='',unit=0,cardIdx=0,flipped=false,filterReview=false,cardOrder=C.map((_,i)=>i),mastered=new Set(),review=new Set(),completed=new Set(),marks={},undo=[],savedSelection=[],phraseOn=true;
let playToken=0,clipEnd=null,raf=0;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const currentList=()=>S.filter(s=>s.lesson===lesson);
const cur=()=>currentList()[idx];
const target=()=>mode==='dictation'?cur().units[unit].text:cur().text;
const normal=x=>x.toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
function stop(){++playToken;players.forEach(p=>p.pause());clipEnd=null;cancelAnimationFrame(raf);raf=0;document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));updatePlayerButtons()}
function updatePlayerButtons(){players.forEach((p,i)=>{$('pause'+i).textContent=p.paused?(p.currentTime>0?'▶ Resume':'▶ Play'):'Ⅱ Pause';document.querySelector('[data-player="'+i+'"]').classList.toggle('active-player',i===lesson)})}
function chooseLesson(i,keepPlaying=false){if(!keepPlaying)stop();else{++playToken;players.forEach((p,j)=>{if(j!==i)p.pause()});clipEnd=null;cancelAnimationFrame(raf)}lesson=i;audio=players[i];$('lesson').value=String(i);idx=unit=cardIdx=0;flipped=false;resetExercise();render();updatePlayerButtons()}
async function play(start,end){stop();let token=playToken;clipEnd=end;try{if(audio.readyState<1)await new Promise((resolve,reject)=>{audio.addEventListener('loadedmetadata',resolve,{once:true});audio.addEventListener('error',reject,{once:true})});if(token!==playToken)return;audio.currentTime=start;audio.playbackRate=Number($('speed'+lesson).value);await audio.play();if(token!==playToken)return;tick()}catch(e){if(token===playToken){clipEnd=null;toast('Audio could not load. Keep both MP3 files beside index.html.')}}}
function tick(){cancelAnimationFrame(raf);if(!audio.paused&&clipEnd!==null&&audio.currentTime>=clipEnd){audio.pause();clipEnd=null}paintPlaying();if(!audio.paused)raf=requestAnimationFrame(tick)}
function paintPlaying(){let t=audio.currentTime;document.querySelectorAll('.sentence[data-sid]').forEach(el=>{let s=S[+el.dataset.sid];el.classList.toggle('playing',!audio.paused&&s&&t>=s.start&&t<s.end)})}
players.forEach((p,i)=>{
 p.addEventListener('play',()=>{if(p.paused)return;if(i!==lesson)chooseLesson(i,true);else players.forEach((other,j)=>{if(j!==i)other.pause()});updatePlayerButtons();tick()});
 p.addEventListener('pause',()=>{updatePlayerButtons();if(p===audio){cancelAnimationFrame(raf);paintPlaying()}});
 p.addEventListener('seeked',()=>{if(p===audio){paintPlaying();if(!p.paused)tick()}});
 p.addEventListener('ended',()=>{updatePlayerButtons();if(p===audio){clipEnd=null;cancelAnimationFrame(raf);paintPlaying()}});
 p.addEventListener('pointerdown',()=>{if(p===audio){++playToken;clipEnd=null}});
 $('stop'+i).onclick=()=>{if(p===audio)stop();else p.pause();p.currentTime=0;updatePlayerButtons()};
 $('speed'+i).onchange=()=>p.playbackRate=Number($('speed'+i).value);
 $('pause'+i).onclick=async()=>{if(!p.paused){p.pause();return}if(i!==lesson)chooseLesson(i);let token=playToken;try{await p.play();if(token===playToken)tick()}catch(e){toast('Audio could not load. Keep both MP3 files beside index.html.')}};
});

function toast(t){$('toast').innerHTML='<button class="small" id="closeToast">×</button>'+esc(t);$('toast').classList.remove('hidden');$('closeToast').onclick=()=> $('toast').classList.add('hidden')}
function closeToast(){$('toast').classList.add('hidden')}
function resetExercise(){viSentence=false;hintShown=false;answerShown=false;selected=[];written='';feedback='';feedbackType='';bank=shuffle(cur().chunks.map((_,i)=>i));if(bank.every((x,i)=>x===i)&&bank.length>1)bank.push(bank.shift())}
function setTab(t){stop();closeToast();tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='sentence'){unit=0;resetExercise()}render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('lesson').onchange=()=>chooseLesson(+$('lesson').value);$('viGlobal').onclick=()=>{viGlobal=!viGlobal;$('viGlobal').textContent='VI '+(viGlobal?'ON':'OFF');if(tab==='home')render()};
$('reset').onclick=()=>{stop();lesson=0;audio=players[0];$('lesson').value='0';idx=unit=cardIdx=0;viGlobal=viSentence=hintShown=answerShown=flipped=filterReview=false;mode='chunks';completed.clear();mastered.clear();review.clear();marks={};undo=[];cardOrder=C.map((_,i)=>i);$('viGlobal').textContent='VI OFF';players.forEach((p,i)=>{p.currentTime=0;p.playbackRate=1;$('speed'+i).value='1'});updatePlayerButtons();resetExercise();setTab('home')};
function textWithPhrases(s,chars=false){let hits=[];C.forEach((c,i)=>{if(c.sid!==s.id)return;let at=s.text.toLowerCase().indexOf(c.phrase.toLowerCase());if(at>=0)hits.push({a:at,b:at+c.phrase.length,i})});hits.sort((a,b)=>a.a-b.a);let out='',h=0;for(let k=0;k<s.text.length;k++){if(hits[h]&&k===hits[h].a)out+='<span class="phrase" data-card="'+hits[h].i+'" tabindex="0" role="button">';out+=chars?'<span data-char="'+k+'"'+(marks[s.id]?.[k]?' class="'+marks[s.id][k]+'"':'')+'>'+esc(s.text[k])+'</span>':esc(s.text[k]);if(hits[h]&&k+1===hits[h].b){out+='</span>';h++}}return out}
function bindPhrase(){document.querySelectorAll('[data-card]').forEach(el=>{const show=()=>{let c=C[+el.dataset.card];toast(c.phrase+' = '+c.vi)};el.onclick=()=>{if(window.getSelection().toString())return;show()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}}})}
function renderHome(){let l=DATA.lessons[lesson];main.innerHTML='<section class="panel"><div class="label">IELTS Speaking Part 2 · Model answer</div><h2>'+esc(l.title.split(' · ')[0])+'</h2><div class="toolbar"><button id="lessonPlay" class="primary">▶ Listen to lesson</button><button id="phrases" class="small">Key phrases '+(phraseOn?'ON':'OFF')+'</button></div><div class="toolbar" id="colourbar"><span class="subtle">Select text:</span><button class="small yellow" data-colour="yellow">Yellow</button><button class="small green" data-colour="green">Green</button><button class="small pink" data-colour="pink">Pink</button><button class="small" data-colour="">Erase</button><button class="small" id="undo">Undo</button><button class="small" id="clearColours">Clear colours</button></div><article class="reading '+(phraseOn?'':'phrases-off')+'" id="reading">'+l.blocks.map(b=>'<p>'+b.ids.map(id=>'<span class="sentence" data-sid="'+id+'">'+textWithPhrases(S[id],true)+'</span>').join(' ')+'</p>'+(viGlobal?'<div class="vi">'+b.ids.map(id=>esc(S[id].vi)).join(' ')+'</div>':'')).join('')+'</article><details class="reference"><summary>Source reference · Digital Detox podcast</summary>'+DATA.reference.blocks.map(b=>'<p><strong>'+esc(b.speaker)+':</strong> '+esc(b.text)+'</p>').join('')+'</details></section>';$('lessonPlay').onclick=()=>{let a=currentList();play(a[0].start,a.at(-1).end)};$('phrases').onclick=()=>{phraseOn=!phraseOn;$('reading').classList.toggle('phrases-off',!phraseOn);$('phrases').textContent='Key phrases '+(phraseOn?'ON':'OFF')};bindPhrase();bindColours()}
function captureSelection(){let sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed)return;savedSelection=[];let r=sel.getRangeAt(0);document.querySelectorAll('#reading [data-char]').forEach(el=>{if(r.intersectsNode(el))savedSelection.push([el.closest('[data-sid]').dataset.sid,el.dataset.char])})}
function paintMarks(){document.querySelectorAll('#reading [data-char]').forEach(el=>{let sid=el.closest('[data-sid]').dataset.sid;el.className=marks[sid]?.[el.dataset.char]||''})}
function bindColours(){document.addEventListener('selectionchange',captureSelection);document.querySelectorAll('[data-colour]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{captureSelection();if(!savedSelection.length)return;undo.push(JSON.parse(JSON.stringify(marks)));savedSelection.forEach(([sid,k])=>{marks[sid]??={};if(b.dataset.colour)marks[sid][k]=b.dataset.colour;else delete marks[sid][k]});paintMarks();window.getSelection().removeAllRanges();savedSelection=[]}});$('undo').onclick=()=>{if(undo.length){marks=undo.pop();paintMarks()}};$('clearColours').onclick=()=>{undo.push(JSON.parse(JSON.stringify(marks)));marks={};paintMarks()}}
function exerciseKey(){return mode+':'+cur().id+(mode==='dictation'?':'+unit:'')}
function completedCount(){return [...completed].filter(k=>k.startsWith(mode+':')&&currentList().some(s=>k.split(':')[1]===String(s.id))).length}
function renderSentence(){let s=cur(),n=currentList().length,parts=s.units.length;let info=mode==='dictation'&&parts>1?' · Part '+(unit+1)+'/'+parts:'';main.innerHTML='<section class="panel"><div class="label">Sentence practice · Paragraph '+(s.block+1)+'</div><div class="sentencehead"><h2>Sentence '+(idx+1)+' / '+n+info+'</h2><select id="jump" aria-label="Choose sentence">'+currentList().map((_,i)=>'<option value="'+i+'" '+(idx===i?'selected':'')+'>Sentence '+(i+1)+'</option>').join('')+'</select></div><div class="modes"><button id="chunksMode" class="'+(mode==='chunks'?'active':'')+'">1 · Build with chunks</button><button id="dictationMode" class="'+(mode==='dictation'?'active':'')+'">2 · Listen &amp; type</button></div><button id="toggleVI" class="small">'+(viSentence?'Hide':'Show')+' Vietnamese</button><div class="vi '+(viSentence?'':'hidden')+'" id="sentenceVI">'+esc(s.vi)+'</div><div class="listenrow"><button class="primary" id="sentencePlay">▶ '+(mode==='dictation'&&parts>1?'Listen to part':'Listen to sentence')+'</button><button id="sentenceStop">■ Stop</button><span class="subtle">'+(mode==='dictation'?target().split(/\s+/).length+' words · Replay when needed':'Tap chunks, then check.')+'</span></div>'+(mode==='chunks'?'<div class="build" id="build">'+(selected.length?selected.map(i=>'<button class="chunk" data-return="'+i+'">'+esc(s.chunks[i])+'</button>').join(''):'<span class="placeholder">Tap the chunks to build the original sentence.</span>')+'</div><div class="bank" id="bank">'+bank.map(i=>'<button class="chunk" data-pick="'+i+'">'+esc(s.chunks[i])+'</button>').join('')+'</div>':'<textarea id="dictation" aria-label="Type what you hear" placeholder="Listen, then type what you hear…" spellcheck="false" autocapitalize="off" autocomplete="off">'+esc(written)+'</textarea><p class="subtle">Take your time. Capitalisation and punctuation do not affect the result.</p>')+'<div class="hint '+(hintShown?'':'hidden')+'" id="hintBox">'+(hintShown?esc(mode==='chunks'?'Start with: '+s.chunks[0]:'First words: '+target().split(' ').slice(0,2).join(' ')):'')+'</div><div class="actions"><button id="prev" '+(idx===0&&(mode==='chunks'||unit===0)?'disabled':'')+'>← Back</button><button class="primary" id="check">Check</button><button id="hint">'+(hintShown?'Hide hint':'Hint')+'</button><button id="clear">Clear</button><button id="answer">'+(answerShown?'Hide answer':'Show answer')+'</button><button id="next" '+(idx===n-1&&(mode==='chunks'||unit===parts-1)?'disabled':'')+'>Next →</button><span class="progress">'+completedCount()+' / '+(mode==='chunks'?n:currentList().reduce((a,x)=>a+x.units.length,0))+' complete</span></div>'+(feedback?'<div class="feedback '+feedbackType+'" role="status">'+esc(feedback)+'</div>':'')+(answerShown?'<div class="answer">'+esc(target())+'</div>':'')+'</section>';
 $('jump').onchange=()=>navigate(+$('jump').value,0);$('chunksMode').onclick=()=>changeMode('chunks');$('dictationMode').onclick=()=>changeMode('dictation');$('toggleVI').onclick=()=>{if($('dictation'))written=$('dictation').value;viSentence=!viSentence;renderSentence()};$('sentencePlay').onclick=()=>{let t=mode==='dictation'?s.units[unit]:s;play(t.start,t.end)};$('sentenceStop').onclick=stop;
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let i=+b.dataset.pick;bank=bank.filter(x=>x!==i);selected.push(i);feedback='';renderSentence()});document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{let i=+b.dataset.return;selected=selected.filter(x=>x!==i);bank.push(i);feedback='';renderSentence()});if($('dictation'))$('dictation').oninput=()=>written=$('dictation').value;
 $('hint').onclick=()=>{hintShown=!hintShown;renderSentence()};$('answer').onclick=()=>{answerShown=!answerShown;renderSentence()};$('clear').onclick=()=>{stop();resetExercise();renderSentence()};$('check').onclick=check;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1)
}
function changeMode(m){if(mode===m)return;stop();mode=m;unit=0;resetExercise();renderSentence()}
function navigate(i,u){stop();idx=i;unit=u;resetExercise();renderSentence()}
function step(dir){if(mode==='dictation'){let n=cur().units.length;if(unit+dir>=0&&unit+dir<n){navigate(idx,unit+dir);return}if(dir<0)navigate(idx-1,currentList()[idx-1].units.length-1);else navigate(idx+1,0)}else navigate(idx+dir,0)}
function check(){let supplied=mode==='chunks'?selected.map(i=>cur().chunks[i]).join(' '):written;let correct=mode==='chunks'?selected.length===cur().chunks.length&&selected.every((x,i)=>x===i):normal(supplied)===normal(target());if(mode==='dictation'&&cur().id===33)correct=correct||normal(supplied)===normal(target().replace('I still check','I still checked'));if(correct){completed.add(exerciseKey());feedback='Well done! '+(mode==='chunks'?'The chunks match the original sentence.':'Your answer matches the recording.');feedbackType='good'}else{feedbackType='bad';feedback=mode==='chunks'?'Not yet matched to the original order. Try again.':'Not quite. Listen again and check missing words, verb forms and spelling.'}renderSentence()}
function availableCards(){return cardOrder.filter(i=>S[C[i].sid].lesson===lesson&&(!filterReview||review.has(i)))}
function renderCards(){let ids=availableCards();if(cardIdx>=ids.length)cardIdx=0;let id=ids[cardIdx],c=C[id];if(!c){main.innerHTML='<section class="panel"><h2>Review Cards</h2><p>No cards marked for review yet.</p><button id="showAll">Show all cards</button></section>';$('showAll').onclick=()=>{filterReview=false;renderCards()};return}let s=S[c.sid];main.innerHTML='<section class="panel"><div class="label">Review Cards · '+(cardIdx+1)+' / '+ids.length+'</div><div class="cardface"><div class="label">'+esc(c.type)+'</div><h2>'+esc(c.phrase)+'</h2><button id="flip">'+(flipped?'Hide meaning':'Show meaning')+'</button>'+(flipped?'<div class="ipa">'+esc(c.ipa)+'</div><div class="vi">'+esc(c.vi)+'</div><div class="cardexample">'+textWithPhrases(s)+'<div class="vi">'+esc(s.vi)+'</div></div>':'')+'</div><div class="listenrow"><button id="cardPlay" class="primary">▶ Listen to source sentence</button><button id="cardStop">■ Stop</button></div><div class="cardtools"><button id="prevCard" '+(cardIdx===0?'disabled':'')+'>← Previous</button><button id="nextCard" '+(cardIdx===ids.length-1?'disabled':'')+'>Next →</button><button id="shuffle">Shuffle</button><button id="needs" class="'+(review.has(id)?'active':'')+'">Needs review</button><button id="known" class="'+(mastered.has(id)?'active':'')+'">Remembered</button><button id="filter">'+(filterReview?'Show all':'Review only')+'</button><button id="source">Practise source sentence</button></div></section>';$('flip').onclick=()=>{flipped=!flipped;renderCards()};$('cardPlay').onclick=()=>play(s.start,s.end);$('cardStop').onclick=stop;$('prevCard').onclick=()=>moveCard(-1);$('nextCard').onclick=()=>moveCard(1);$('shuffle').onclick=()=>{stop();shuffle(cardOrder);cardIdx=0;flipped=false;renderCards()};$('needs').onclick=()=>{review.add(id);mastered.delete(id);renderCards()};$('known').onclick=()=>{mastered.add(id);review.delete(id);renderCards()};$('filter').onclick=()=>{stop();filterReview=!filterReview;cardIdx=0;flipped=false;renderCards()};$('source').onclick=()=>{idx=currentList().findIndex(x=>x.id===c.sid);setTab('sentence')};bindPhrase()}
function moveCard(d){stop();cardIdx+=d;flipped=false;renderCards()}
function render(){if(tab==='home')renderHome();else if(tab==='sentence')renderSentence();else renderCards()}
resetExercise();render();updatePlayerButtons();
</script></body></html>
